  /* --------------------- v2 全屏横屏 / 旋转提示 --------------------- */
  /**
   * 进入全屏并尽量锁定横屏。
   * 全屏与屏幕方向锁都可能不被支持（桌面浏览器 / 无用户手势 / 权限不足），
   * 因此整段用 try/catch + Promise catch 兜住：失败只给提示，绝不抛错。
   */
  function enterFullscreenLandscape() {
    const root = document.documentElement;
    try {
      const req = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
      if (typeof req === 'function') {
        const p = req.call(root);
        if (p && typeof p.then === 'function') {
          p.then(function () { tryLockLandscape(); }).catch(function () { toast('全屏被浏览器拒绝，可直接旋转设备'); });
        } else {
          setTimeout(tryLockLandscape, 120);
        }
      } else {
        toast('当前环境不支持全屏，可直接旋转设备');
      }
    } catch (e) {
      toast('当前环境不支持全屏，可直接旋转设备');
    }
    // 全屏按钮也算一种「我知道了」，收起提示条
    dismissRotateHint();
  }
  /** 尝试锁定横屏；不支持时静默失败 */
  function tryLockLandscape() {
    try {
      const so = screen.orientation;
      if (so && typeof so.lock === 'function') {
        const p = so.lock('landscape');
        if (p && typeof p.catch === 'function') p.catch(function () { /* 未全屏或无权限：忽略 */ });
      }
    } catch (e) { /* 忽略：只全屏不锁方向 */ }
  }
  function dismissRotateHint() {
    // 仅本次会话内记住：刷新后仍会再提示一次，避免玩家永久失去「全屏横屏」引导
    if (el.rotateHint) el.rotateHint.classList.add('dismissed');
  }

  /* ------------------------------ 自动播放状态 ------------------------------ */
  function updateAutoButton() {
    if (!el.qbAuto) return;
    const on = !!State.settings.autoPlay && State.phase !== 'title' && !State.uiLocked;
    el.qbAuto.textContent = on ? '❚❚' : '▶';
    el.qbAuto.classList.toggle('on', on);
    el.qbAuto.title = on ? '自动播放中（点击停止）' : '自动播放（A）';
    if (!on) clearAutoTimers();
  }
  /** 文本打完后，若开启自动播放则安排推进 */
  function scheduleAuto() {
    if (!State.settings.autoPlay || State.uiLocked || State.phase !== 'line') return;
    clearTimeout(Runtime.autoTextTimer);
    Runtime.autoTextTimer = setTimeout(() => { if (State.phase === 'line' && !State.uiLocked) advance(); }, State.settings.autoInterval);
  }
  function toggleAuto() {
    if (State.phase === 'title') return;
    State.settings.autoPlay = !State.settings.autoPlay;
    Persist.writeSettings();
    updateAutoButton();
    toast(State.settings.autoPlay ? '自动播放：开' : '自动播放：关');
    if (State.settings.autoPlay && Runtime.type.done && State.phase === 'line') scheduleAuto();
  }

  /* ==========================================================================
   * 模块 8 · Input —— 鼠标 / 触屏 / 键盘
   * ========================================================================== */
  function bindEvents() {
    // ---- 标题画面 ----
    el.btnStart.addEventListener('click', (ev) => { ev.stopPropagation(); startGame(); });
    el.btnContinue.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (State.playMode !== 'title') State.playMode = 'title';
      const auto = Persist.readAuto();
      if (auto) { loadFrom(auto); return; }
      const slot = [1, 2, 3].map((i) => Persist.readSlot(i)).filter(Boolean)[0];
      if (slot) { loadFrom(slot); return; }
      toast('暂无可读取的存档');
    });
    el.btnGallery.addEventListener('click', (ev) => { ev.stopPropagation(); openGallery(); });
    el.btnSettings.addEventListener('click', (ev) => { ev.stopPropagation(); openSettings(); });
    if (el.btnAffection) el.btnAffection.addEventListener('click', (ev) => { ev.stopPropagation(); openAffection(); });
    if (el.btnRotate) el.btnRotate.addEventListener('click', (ev) => { ev.stopPropagation(); enterFullscreenLandscape(); });
    if (el.rotateHintDismiss) el.rotateHintDismiss.addEventListener('click', (ev) => { ev.stopPropagation(); dismissRotateHint(); });
    if (el.rotateHintTurn) el.rotateHintTurn.addEventListener('click', (ev) => { ev.stopPropagation(); enterFullscreenLandscape(); });

    // ---- 结局画面 ----
    el.btnEndingTitle.addEventListener('click', (ev) => { ev.stopPropagation(); backToTitle(''); });
    el.btnEndingGallery.addEventListener('click', (ev) => { ev.stopPropagation(); openGallery(); });

    // ---- 快捷工具条 ----
    el.qbLog.addEventListener('click', (ev) => { ev.stopPropagation(); openHistory(); });
    el.qbAuto.addEventListener('click', (ev) => { ev.stopPropagation(); toggleAuto(); });
    el.qbSave.addEventListener('click', (ev) => { ev.stopPropagation(); saveToSlot(1); });
    el.qbMenu.addEventListener('click', (ev) => { ev.stopPropagation(); openMenu(); });

    // ---- 点击画面推进（对话框 / 立绘区域 / 整屏） ----
    const tapAdvance = (ev) => {
      if (State.modal || State.uiLocked) return;
      const t = ev.target;
      if (t instanceof Element && t.closest('button, .modal, #choice-list, a')) return;
      advance();
    };
    el.dbox.addEventListener('click', (ev) => { ev.stopPropagation(); tapAdvance(ev); });
    el.gameScreen.addEventListener('click', tapAdvance);

    // ---- 键盘 ----
    document.addEventListener('keydown', (ev) => {
      const tag = (ev.target && ev.target.tagName) ? ev.target.tagName.toLowerCase() : '';
      const typing = tag === 'input' || tag === 'textarea' || (ev.target && ev.target.isContentEditable);
      if (ev.ctrlKey && (ev.key === 's' || ev.key === 'S')) {
        ev.preventDefault();
        if (State.playMode === 'game') saveToSlot(1); else toast('现在没有进行中的进度');
        return;
      }
      if (ev.key === 'Escape') {
        ev.preventDefault();
        if (State.modal) closeModal();
        else if (State.playMode === 'game') openMenu();
        return;
      }
      if (typing) return;
      if (ev.key === ' ' || ev.key === 'Enter' || ev.key === 'Spacebar') {
        if (State.modal) {
          // 面板中：回车/空格关闭（避免阻塞推进）
          if (ev.key === 'Enter') { ev.preventDefault(); closeModal(); }
          return;
        }
        ev.preventDefault();
        advance();
        return;
      }
      const k = ev.key.toLowerCase();
      if (k === 'l' && State.playMode === 'game') { openHistory(); return; }
      if (k === 'a' && State.playMode === 'game') { toggleAuto(); return; }
      if (k === 's' && State.playMode === 'game') { saveToSlot(1); return; }
      if (State.phase === 'choice' && /^[1-9]$/.test(k)) {
        const idx = Number(k) - 1;
        const btns = el.choiceList.querySelectorAll('.choice-btn');
        if (btns[idx]) btns[idx].click();
        return;
      }
      if (k === 'h' && State.playMode === 'game') { openHistory(); return; }
    });

    // ---- 视口变化：重新贴合高度（iOS 地址栏 / 旋屏） ----
    const syncHeight = () => {
      const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      if (h) document.documentElement.style.setProperty('--cg-app-h', Math.round(h) + 'px');
      if (State.phase === 'choice') requestAnimationFrame(positionChoiceList);
    };
    window.addEventListener('resize', syncHeight);
    window.addEventListener('orientationchange', () => setTimeout(syncHeight, 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncHeight);
    syncHeight();
  }

  /* ==========================================================================
   * 模块 9 · Boot —— 启动流程
   * ========================================================================== */
  function readQuery() {
    const q = { fast: false, autostart: false, scene: '' };
    try {
      const sp = new URLSearchParams(location.search || '');
      q.fast = sp.get('fast') === '1' || sp.get('fast') === 'true';
      q.autostart = sp.get('autostart') === '1' || sp.get('autostart') === 'true';
      q.scene = str(sp.get('scene'), '');
      if (sp.get('instant') === '1') q.fast = true;
    } catch (e) { /* file:// 下 URLSearchParams 依旧可用，异常时忽略 */ }
    return q;
  }

  function init() {
    // 1) 读数据，失败也要能渲染标题画面（绝不白屏）
    const res = readRawData();
    if (res.ok) State.data = normalizeData(res.data);
    else {
      State.dataErr = res.err;
      State.data = normalizeData({});
      State.fatal = res.err;
    }
    // 2) 主题 / 字号 / 设置
    applyTheme();
    applyFontSize();
    // 3) 测试友好参数
    const q = readQuery();
    if (q.fast) State.settings.textSpeed = 'instant';
    // 4) 渲染标题（始终先渲染，保证 DOM 可截图）
    State.phase = 'title';
    showScreen('title');
    renderTitleScreen();
    bindEvents();
    updateAutoButton();
    // 5) autostart：跳过标题直接进入 start 场景
    if (q.autostart && State.data.scenes.length) {
      if (q.scene && State.data.sceneMap[q.scene]) { startGame(); enterScene(q.scene, 0); execLine(); }
      else startGame();
    }
    if (State.dataErr) console.warn('[galgame] 数据异常：' + State.dataErr);
    if (State.data.warnings.length) console.warn('[galgame] 数据提示：', State.data.warnings);
    document.documentElement.setAttribute('data-ready', '1');
    // 便于自动化 / 调试读取内部状态（只读导出）
    window.GALGAME = {
      version: '1.0.0',
      state: State,
      advance,
      startGame,
      backToTitle,
      openHistory,
      openSettings,
      openGallery,
      openSaves,
      openAffection,
      enterFullscreenLandscape,
      evalConditions,
      resolveEndingByCondition,
      applyEffects,
      saveToSlot,
      loadFrom,
      getVars: () => clone(State.vars),
      getPosition: () => ({ sceneId: State.sceneId, lineIdx: State.lineIdx, phase: State.phase }),
      /** 当前背景 id（含行级 background 覆盖的结果） */
      getBg: () => State.bgId,
      /** 背景切换次数：便于断言“确实换了背景” */
      getBgRev: () => Runtime.bgRev,
      /** 当前背景来自哪一行：'line'（行级覆盖）/ 'scene'（沿用场景背景） */
      getBgSource: () => (State.bgId && State.sceneId === Runtime.bgSourceScene
        && State.bgId !== Runtime.bgSourceSceneBg ? 'line' : 'scene')
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
