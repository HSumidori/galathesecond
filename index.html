"goto":"c1s2","ending":"","effects":{"affection.char1":1}},{"text":"无视她，心想这同桌真难相处。","goto":"c1s2","ending":"","effects":{"affection.char1":-1}},{"text":"观察她，觉得她可能只是紧张。","goto":"c1s2","ending":"","effects":{"affection.char1":2}}]}]},{"id":"c1s2","chapter":1,"name":"秘密喂猫","background":"hallway","lines":[{"type":"narration","text":"课间，我去洗手间，路过走廊拐角时听见细小的猫叫。"},{"type":"narration","text":"拐角处，李杰正蹲在地上，手心里托着掰碎的面包。"},{"type":"narration","text":"一只灰扑扑的流浪猫正埋头在她掌心，吃得正香。"},{"type":"narration","text":"她没发现我，脸上是难得一见的柔和表情。"},{"type":"dialogue","speaker":"char1","text":"慢点吃，别噎着，明天我再带小鱼干来。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"我忍不住向前迈了一步，鞋底发出轻响。"},{"type":"narration","text":"她像受惊的兔子一样抬头，脸颊瞬间涨红。"},{"type":"dialogue","speaker":"char1","text":"你、你什么时候在那里的！？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她慌慌张张地站起来，面包屑撒了一地。"},{"type":"dialogue","speaker":"char1","text":"不、不是你想的那样！我只是……路过！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"说完，她转身就跑，连猫都被她吓跑了。"},{"type":"choice","prompt":"","options":[{"text":"承诺保守秘密，假装没看到。","goto":"c1s3","ending":"","effects":{"affection.char1":2,"flags.keep_secret":true}},{"text":"笑她‘原来你会对猫温柔’。","goto":"c1s3","ending":"","effects":{"affection.char1":-2}},{"text":"说明天也带点猫粮来。","goto":"c1s3","ending":"","effects":{"affection.char1":3,"flags.cat_food":true}}]}]},{"id":"c1s3","chapter":1,"name":"午休的独处","background":"rooftop","lines":[{"type":"narration","text":"午休时间，我为了逃开教室的喧闹上了天台。"},{"type":"narration","text":"推开门，却看见李杰坐在角落，独自啃着一块面包。"},{"type":"narration","text":"她听到动静，抬头看见是我，皱了皱眉。"},{"type":"dialogue","speaker":"char1","text":"怎么又是你？阴魂不散啊。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"我没接话，在她旁边找了个位置坐下，隔了两米远。"},{"type":"dialogue","speaker":"char1","text":"……哼，你倒挺会挑地方。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她咬了一口面包，小声嘟囔。"},{"type":"dialogue","speaker":"char1","text":"教室太吵了，吵得人头疼。这里至少能安静会儿。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她似乎并不真的讨厌我，只是习惯了用刺来保护自己。"},{"type":"dialogue","speaker":"char1","text":"喂，面包分你一半，别饿死了又怪我。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她掰下一半面包，别扭地递过来，眼神飘向别处。"},{"type":"choice","prompt":"","options":[{"text":"接过面包，安静地一起吃。","goto":"c1s4","ending":"","effects":{"affection.char1":2}},{"text":"拒绝她，说不用了。","goto":"c1s4","ending":"","effects":{"affection.char1":-2}},{"text":"接过面包，问她喜欢什么游戏。","goto":"c1s4","ending":"","effects":{"affection.char1":1,"flags.game_talk":true}}]}]},{"id":"c1s4","chapter":1,"name":"值日互助","background":"classroom","lines":[{"type":"narration","text":"放学铃响，同学们一哄而散，教室里只剩下我和李杰。"},{"type":"narration","text":"今天轮到我值日，她本来可以走的，却拿着扫把站在门口。"},{"type":"dialogue","speaker":"char1","text":"别误会，我只是还你上次借笔记的人情。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她走过来，开始笨手笨脚地扫起地来。"},{"type":"narration","text":"扫把在她手里像有千斤重，地上反而更乱了。"},{"type":"dialogue","speaker":"char1","text":"……看什么看？我只是不擅长而已。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"我忍不住笑出声，她立刻涨红了脸。"},{"type":"dialogue","speaker":"char1","text":"笑什么！再笑我就不帮了！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她嘴上这么说，手上的动作却没停。"},{"type":"dialogue","speaker":"char1","text":"喂，擦窗户的抹布给我，别想偷懒。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"choice","prompt":"","options":[{"text":"道谢，并约她下次一起值日。","goto":"c1s5","ending":"","effects":{"affection.char1":2}},{"text":"笑话她动作笨拙。","goto":"c1s5","ending":"","effects":{"affection.char1":-2}},{"text":"沉默接受帮助，但偷偷把她的扫把拿稳。","goto":"c1s5","ending":"","effects":{"affection.char1":1}}]}]},{"id":"c1s5","chapter":1,"name":"游戏话题","background":"street","lines":[{"type":"narration","text":"夕阳把街道染成橘红色，我和李杰一前一后走在回家路上。"},{"type":"narration","text":"她本来说要分道扬镳，却不知为何放慢了脚步。"},{"type":"dialogue","speaker":"char1","text":"……你也玩那个？《复古勇者》？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"我随口提起的一款老游戏，她突然两眼放光。"},{"type":"dialogue","speaker":"char1","text":"不会吧？现在还有人记得那款游戏？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她转过身，兴奋得脸颊泛红，完全忘了之前的高冷。"},{"type":"dialogue","speaker":"char1","text":"我跟你讲，那个隐藏关卡其实要先用火把烧掉藤蔓，不是用剑砍！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她滔滔不绝地说着攻略，手舞足蹈。"},{"type":"dialogue","speaker":"char1","text":"下次一起玩吗？联机？我技术很好的！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"说完她意识到自己太激动，忙别过脸去，耳尖红透。"},{"type":"choice","prompt":"","options":[{"text":"约她周末去游戏厅。","goto":"c2s1","ending":"","effects":{"affection.char1":3,"flags.arcade_invite":true}},{"text":"说有机会一起联机。","goto":"c2s1","ending":"","effects":{"affection.char1":2}},{"text":"保持距离，说今天先回家了。","goto":"c2s1","ending":"","effects":{"affection.char1":-1}}]}]},{"id":"c2s1","chapter":2,"name":"学园祭准备","background":"classroom","lines":[{"type":"narration","text":"班会课吵得像菜市场，学园祭筹备成了无休止的拉锯战。"},{"type":"narration","text":"班长拍桌提议做鬼屋，话没说完，角落里一道影子蹿了起来。"},{"type":"dialogue","speaker":"char1","text":"鬼屋？超棒的！交给我吧，本小姐亲自出马！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"全班欢呼，李杰得意地叉腰，而我叹了口气，这姑娘又要搞事。"},{"type":"narration","text":"为了世界和平，我深吸一口气，举手说：“我也来帮忙。”"},{"type":"dialogue","speaker":"char1","text":"哈？你？你该不会是担心我吧？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"我别过脸，耳根有点热：“才不是，只是不想班级丢脸。”"},{"type":"dialogue","speaker":"char1","text":"嘴硬～那放学后空教室集合，别迟到哦！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她冲我眨了眨眼，尾音上扬，我的心跳漏了一拍。"},{"type":"choice","prompt":"","options":[{"text":"早点过去，别让她等太久","goto":"c2s2","ending":"","effects":{"affection.char1":2}},{"text":"先在走廊绕一圈，假装偶遇","goto":"c2s2","ending":"","effects":{"affection.char1":1,"flags.tsundere":true}},{"text":"拖到最后再去，表示自己不在乎","goto":"c2s2","ending":"","effects":{"affection.char1":-1}}]}]},{"id":"c2s2","chapter":2,"name":"两人的道具间","background":"empty_classroom","lines":[{"type":"narration","text":"推开空教室的门，李杰正对着一堆纸箱唉声叹气。"},{"type":"dialogue","speaker":"char1","text":"啊！你来啦！快看，这些纸箱怎么做成墓碑啊？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她拿着美工刀比划，刀片摇摇欲坠，我赶紧上前接住。"},{"type":"narration","text":"“我来裁，你负责设计。”我接过刀，她眼睛亮晶晶地点头。"},{"type":"dialogue","speaker":"char1","text":"真的？那我要画最恐怖的鬼脸，吓死你！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她趴在桌上画画，嘴里哼着歌，马尾晃得我心烦意乱。"},{"type":"narration","text":"我裁着纸箱，看着她的侧脸，不知不觉笑出了声。"},{"type":"dialogue","speaker":"char1","text":"喂，你笑什么？我画得很搞笑吗？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"“没，只是觉得你像只猫。”话一出口我就后悔了。"},{"type":"dialogue","speaker":"char1","text":"猫？本小姐可是可爱担当，才不是猫呢！不过……你夸我可爱我也不会高兴，笨蛋！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"她别过头，耳尖通红，空气里胶水味混着一丝甜。"},{"type":"narration","text":"天色渐暗，我们做出几个像样的道具，她伸了个懒腰。"},{"type":"dialogue","speaker":"char1","text":"谢啦，你手还挺巧的。明天继续？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"choice","prompt":"","options":[{"text":"夸她“今天也很可爱”","goto":"c2s3","ending":"","effects":{"affection.char1":2}},{"text":"说“明天别又切到手”","goto":"c2s3","ending":"","effects":{"affection.char1":-1,"flags.tsundere":true}},{"text":"沉默地点点头","goto":"c2s3","ending":"","effects":{"affection.char1":1}}]}]},{"id":"c2s3","chapter":2,"name":"流言蜚语","background":"hallway","lines":[{"type":"narration","text":"午休的走廊里，几个女生聚在储物柜旁窃窃私语。"},{"type":"narration","text":"“那个李杰，当个负责人就神气什么，还指挥我们做这做那。”"},{"type":"narration","text":"“就是啊，平时装可爱，其实骨子里超傲慢吧。”"},{"type":"narration","text":"我握紧拳头，正要上前，李杰从拐角走了过来。"},{"type":"narration","text":"她明显听到了，脚步顿了顿，但还是面无表情地继续走。"},{"type":"narration","text":"我忍不住出声：“喂，你们闭嘴！她为了鬼屋每天留到最晚，你们知道什么？”"},{"type":"narration","text":"女生们讪讪散开，李杰却停下，转过头，眼神冷得陌生。"},{"type":"dialogue","speaker":"char1","text":"谁要你多管闲事啊！笨蛋！","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我被她的眼神刺得发愣，嘴里只挤出一句：“我只是……”"},{"type":"dialogue","speaker":"char1","text":"我的事不用你管，别以为帮过我几次就很熟。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她说完转身就走，背影挺得笔直，像在生闷气。"},{"type":"narration","text":"我站在原地，胸口像压了块石头，堵得发慌。"},{"type":"choice","prompt":"","options":[{"text":"追上去问清楚","goto":"c2s4","ending":"","effects":{"affection.char1":1,"flags.confront":true}},{"text":"先冷静，放学后再找她说","goto":"c2s4","ending":"","effects":{"affection.char1":-1,"flags.calm":true}},{"text":"觉得委屈，也转身离开","goto":"c2s4","ending":"","effects":{"affection.char1":-2}}]}]},{"id":"c2s4","chapter":2,"name":"突如其来的冷淡","background":"classroom","lines":[{"type":"narration","text":"接下来的几天，李杰像躲瘟神一样对我避之不及。"},{"type":"narration","text":"道具制作变成我独自一人，她总是找各种借口提前离开。"},{"type":"narration","text":"课间我试图搭话，她要么假装没听见，要么和别的同学笑闹。"},{"type":"narration","text":"我终于忍不住，放学后在教室门口堵住她：“李杰，我们谈谈。”"},{"type":"dialogue","speaker":"char1","text":"没什么好谈的，给我让开。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我上前一步，声音有些急切：“为什么躲着我？我哪里做错了？”"},{"type":"dialogue","speaker":"char1","text":"没有，只是不想被误会。我的事不用你管，你听不懂吗？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她的声音微微发抖，眼神却强硬，像只受伤的刺猬。"},{"type":"narration","text":"我注意到她眼下黑眼圈很重，手指上多出几道创可贴。"},{"type":"dialogue","speaker":"char1","text":"求你了，别管我。这样对我们都好。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她一把推开我跑出教室，我的喉咙像被棉花堵住一样难受。"},{"type":"narration","text":"我攥紧拳头，暗暗发誓无论如何都要找到真相。"},{"type":"choice","prompt":"","options":[{"text":"去天台找她，她可能在那里","goto":"c2s5","ending":"","effects":{"affection.char1":2,"flags.search_rooftop":true}},{"text":"先回家，明天再问","goto":"c2s5","ending":"","effects":{"affection.char1":-1}},{"text":"去找班主任商量","goto":"c2s5","ending":"","effects":{"affection.char1":1,"flags.ask_teacher":true}}]}]},{"id":"c2s5","chapter":2,"name":"累倒的真相","background":"rooftop","lines":[{"type":"narration","text":"我气喘吁吁地跑上天台，夕阳把整片天空染成橘红色。"},{"type":"narration","text":"李杰靠在天台角落的墙边睡着了，手里紧紧攥着一叠纸。"},{"type":"narration","text":"走近一看，是我弄丢的鬼屋设计资料，纸张边缘被攥得发皱。"},{"type":"narration","text":"原来她这段时间冷淡我，是为了帮我整理资料，还熬夜弄伤手指。"},{"type":"narration","text":"我慢慢蹲下身，手指颤抖着拨开她额前散乱的碎发。"},{"type":"dialogue","speaker":"char1","text":"才不是……担心你呢……笨蛋……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她梦呓般低语，我心头一酸，脱下外套披在她肩上。"},{"type":"narration","text":"直到天边最后一缕光消失，她的睫毛颤了颤，醒了。"},{"type":"dialogue","speaker":"char1","text":"你……怎么在这里？啊！资料！","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她手忙脚乱地想藏起资料，我抢先一步按住了她的手。"},{"type":"narration","text":"我轻声说：“我都知道了。对不起，还有，谢谢。”"},{"type":"dialogue","speaker":"char1","text":"谁要你谢啊！我才不是为了你……只是负责人该做的……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她的脸红得发烫，我忍不住笑了，心里明白自己栽了。"},{"type":"choice","prompt":"","options":[{"text":"牵起她的手说以后一起承担","goto":"c3s1","ending":"","effects":{"affection.char1":3,"flags.true_route":true}},{"text":"笑着说“还是这么不坦率”","goto":"c3s1","ending":"","effects":{"affection.char1":2}},{"text":"认真地说“我以后不会再让你一个人”","goto":"c3s1","ending":"","effects":{"affection.char1":3,"flags.good_route":true}}]}]},{"id":"c3s1","chapter":3,"name":"游戏厅之约","background":"street","lines":[{"type":"narration","text":"放学后的街道，夕阳把我的影子拉得很长。"},{"type":"dialogue","speaker":"char1","text":"喂，今天陪我去个地方呗？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我还没来得及回答，她已经拽住了我的书包带。"},{"type":"dialogue","speaker":"char1","text":"游戏厅！新出了个合作射击游戏，超好玩。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她眼睛亮晶晶的，像只发现新玩具的猫。"},{"type":"choice","prompt":"","options":[{"text":"陪她打合作射击","goto":"c3s2","ending":"","effects":{"affection.char1":2}},{"text":"提议去抓娃娃","goto":"c3s2","ending":"","effects":{"affection.char1":1}},{"text":"挑战赛车游戏","goto":"c3s2","ending":"","effects":{"affection.char1":-1}}]},{"type":"narration","text":"游戏厅的灯光有些晃眼，她却比霓虹还要显眼。"},{"type":"dialogue","speaker":"char1","text":"你枪法不错嘛，下次还来！","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她的笑脸让我有一瞬间的失神。"},{"type":"narration","text":"回家的路上，她哼着歌，影子偶尔交错。"}]},{"id":"c3s2","chapter":3,"name":"试探心意","background":"empty_classroom","lines":[{"type":"narration","text":"空教室的桌椅堆在一起，她突然说要帮我整理学生证。"},{"type":"dialogue","speaker":"char1","text":"对了，你觉得我怎么样？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她的手指停在半空，侧脸被夕阳勾出毛茸茸的边。"},{"type":"narration","text":"我心跳漏了一拍，原来她也会有认真的时候。"},{"type":"dialogue","speaker":"char1","text":"不许说可爱以外的答案哦。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她补了一句，试图用玩笑掩盖紧张。"},{"type":"choice","prompt":"","options":[{"text":"其实你比想象中更认真。","goto":"c3s3","ending":"","effects":{"affection.char1":3,"flags.true_route":true}},{"text":"你是我最好的搭档。","goto":"c3s4","ending":"","effects":{"affection.char1":2,"flags.good_route":true}},{"text":"你只是个普通的麻烦精。","goto":"c3s5","ending":"","effects":{"affection.char1":-1,"flags.normal_route":true}}]},{"type":"narration","text":"她安静地等我的回答，呼吸都轻了。"},{"type":"narration","text":"气氛微妙，空气里飘着粉笔灰的味道。"},{"type":"dialogue","speaker":"char1","text":"原来……你是这么想的啊。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她的唇角微微上扬，又很快抿住。"},{"type":"narration","text":"那一刻，我好像听见有什么东西轻轻落了地。"}]},{"id":"c3s3","chapter":3,"name":"天台上的鼓励","background":"rooftop","lines":[{"type":"narration","text":"学园祭的天台，风声很大，她的发丝乱飞。"},{"type":"dialogue","speaker":"char1","text":"怎么办，我、我有点紧张……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她攥着鬼屋的传单，指尖发白。"},{"type":"narration","text":"我拍了拍她的肩，说：“有我在，不用怕。”"},{"type":"dialogue","speaker":"char1","text":"有你在……真好。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她脱口而出，然后整张脸烧了起来。"},{"type":"narration","text":"我忽然想抱抱她，这个总是逞强的“可爱担当”。"},{"type":"dialogue","speaker":"char1","text":"你别笑！我刚刚什么都没说！","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我伸手揉乱她的头发，低声应了一句。"},{"type":"narration","text":"风停了，她的眼睛比星星还亮。"},{"type":"ending","endingId":"true_end"}]},{"id":"c3s4","chapter":3,"name":"庆典结束","background":"classroom","lines":[{"type":"narration","text":"鬼屋大获成功，教室里一片欢呼。"},{"type":"narration","text":"她躲在角落，偷偷朝我比了个胜利的手势。"},{"type":"dialogue","speaker":"char1","text":"喂，过来一下。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她拉着我的袖子，一路跑到走廊的背光处。"},{"type":"dialogue","speaker":"char1","text":"谢谢你陪我胡闹，搭档。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她的声音很轻，却一字不落地砸进心里。"},{"type":"narration","text":"我回握住她的手，掌心微微发烫。"},{"type":"dialogue","speaker":"char1","text":"以后也请多指教啦。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我们相视一笑，像完成了一场心照不宣的约定。"},{"type":"ending","endingId":"good_end"}]},{"id":"c3s5","chapter":3,"name":"最后的答案","background":"hallway","lines":[{"type":"narration","text":"放学后的走廊，夕阳把她的影子拖得很长。"},{"type":"narration","text":"我在她身后叫住她，她回头，脸上带着点困惑。"},{"type":"dialogue","speaker":"char1","text":"怎么了？还有事吗？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我张了张嘴，最终只是摇了摇头。"},{"type":"dialogue","speaker":"char1","text":"哦，那……明天见，同桌。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"她挥挥手，转身走远，裙角轻轻扬起。"},{"type":"narration","text":"就这样吧，至少我们还是普通的同桌。"},{"type":"narration","text":"我站在原地，直到她的背影消失在楼梯口。"},{"type":"ending","endingId":"normal_end"}]}],"endings":[{"id":"true_end","title":"傲娇女友的诞生","text":"李杰红着脸，却仍嘴硬说“才不是喜欢你呢”。但她的手没有松开，两人在夕阳下并肩而行，从那天起，她成了会为男主做便当、会等男主一起回家的傲娇女友。","kind":"true","condition":[]},{"id":"good_end","title":"最佳搭档","text":"李杰不再用毒舌掩饰自己，她成了男主身边最可靠的朋友。两人一起打游戏、一起值日、一起被老师骂，互相吐槽却形影不离，也许某天会跨过那条线。","kind":"good","condition":[]},{"id":"normal_end","title":"普通的同桌","text":"男主没有回应李杰的期待，李杰也重新缩回自己的壳里。两人回到普通同桌的关系，偶尔斗嘴，偶尔对视后尴尬移开视线，青春里留下一点微妙的遗憾。","kind":"normal","condition":[]}],"start":"c1s1"}</script>
<script>
/* ============================================================================
 * Galgame 独立播放器引擎（单文件 / 零依赖 / 原生 ES2020+）
 * 数据来源：上方 id="galgame-data" 的 JSON 脚本块（由打包器整体替换占位符）
 * 模块顺序：Util → Data → Persist → State → Render → Input → Boot
 * ========================================================================== */
(function () {
  'use strict';

  /* ==========================================================================
   * 模块 0 · Util —— 通用小工具
   * ========================================================================== */
  const $ = (sel) => document.querySelector(sel);

  /** HTML 转义，所有用户数据都经此进入 innerHTML */
  function esc(v) {
    return String(v ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  /** 取字符串字段，非法则回退 */
  function str(v, fb = '') { return typeof v === 'string' ? v : (v == null ? fb : String(v)); }
  /** 取负整数（数组下标 / 索引） */
  function int(v, fb = 0) { const n = Number(v); return Number.isFinite(n) ? Math.trunc(n) : fb; }
  /** 取正数（时间间隔等） */
  function num(v, fb = 0) { const n = Number(v); return Number.isFinite(n) ? n : fb; }
  /** 取对象，非对象则回退空对象 */
  function obj(v) { return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; }
  /** 取数组，非数组则回退空数组 */
  function arr(v) { return Array.isArray(v) ? v : []; }
  /** 深拷贝（数据来自 JSON，结构安全） */
  function clone(v) { try { return JSON.parse(JSON.stringify(v)); } catch (e) { return null; } }

  /** 统一时间戳格式：2026-10-02 20:13 */
  function fmtTime(ts) {
    const n = num(ts, 0);
    if (!n) return '—';
    const d = new Date(n);
    if (isNaN(d.getTime())) return '—';
    const p = (x) => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  /** localStorage 安全包装：无痕模式 / file:// 受限时降级为内存存储 */
  const memStore = Object.create(null);
  const LS = {
    available: (function () {
      try { const k = '__galgame_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
      catch (e) { return false; }
    })(),
    get(k) { try { return this.available ? localStorage.getItem(k) : (k in memStore ? memStore[k] : null); } catch (e) { return null; } },
    set(k, v) { try { if (this.available) localStorage.setItem(k, v); else memStore[k] = v; } catch (e) { memStore[k] = v; } },
    del(k) { try { if (this.available) localStorage.removeItem(k); else delete memStore[k]; } catch (e) { delete memStore[k]; } },
    /** 读 JSON，解析失败返回 fallback */
    getJSON(k, fb) {
      const raw = this.get(k);
      if (!raw) return fb;
      try { const v = JSON.parse(raw); return v == null ? fb : v; } catch (e) { return fb; }
    },
    setJSON(k, v) { this.set(k, JSON.stringify(v)); }
  };

  /* localStorage 键名（按作品标题隔离，避免多部作品互相覆盖） */
  const KEY = {
    settings: 'galgame.settings.v1',
    autosave: 'galgame.save.auto.v1',
    slot: (i) => `galgame.save.slot${i}.v1`,
    gallery: 'galgame.gallery.v1',
    read: 'galgame.read.v1'
  };

  /* ==========================================================================
   * 模块 1 · Data —— 读取并规范化数据契约（Story Schema v1）
   * 规范化原则：任何缺失 / 类型错误都降级为安全值，绝不抛错白屏
   * ========================================================================== */
  function readRawData() {
    const el = document.getElementById('galgame-data');
    if (!el) return { ok: false, err: '缺少数据容器（galgame-data）' };
    const text = (el.textContent || '').trim();
    if (!text) return { ok: false, err: '数据为空：打包器尚未注入剧本 JSON' };
    try {
      const parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== 'object') return { ok: false, err: '剧本 JSON 顶层不是对象' };
      return { ok: true, data: parsed };
    } catch (e) {
      return { ok: false, err: '剧本 JSON 解析失败：' + (e && e.message ? e.message : e) };
    }
  }

  const CELL_COUNT = 12; // placeholder.gradient 被切分的色标格子数

  /** 把 gradient 字符串切成若干色，供占位立绘上色 */
  function parseGradientColors(gradient, fb) {
    const s = str(gradient, '');
    const hexes = s.match(/#[0-9a-fA-F]{3,8}\b/g) || [];
    const rgbas = s.match(/rgba?\([^)]*\)/g) || [];
    const list = hexes.concat(rgbas).map((c) => c.trim());
    if (!list.length) return { colors: [], raw: '' };
    const out = [];
    for (let i = 0; i < CELL_COUNT; i++) out.push(list[Math.min(list.length - 1, Math.floor(i * list.length / CELL_COUNT))]);
    return { colors: out, raw: list[list.length - 1], first: list[0] };
  }

  /* ---- v2 条件（endings[].condition / choice.options[].require 共用同一套结构） ---- */
  const COND_OPS = ['>=', '>', '<=', '<', '==', '!='];

  /**
   * 规范化条件数组：只保留合法项（var 非空、op 受支持）。
   * 非法项被丢弃并写入 warnings（不阻断播放）。
   */
  function normalizeConditions(list, where) {
    const out = [];
    arr(list).forEach((c, i) => {
      if (!c || typeof c !== 'object') return;
      const v = str(c.var, '');
      const op = str(c.op, '');
      if (!v) return;
      if (COND_OPS.indexOf(op) < 0) return;
      out.push({ var: v, op, value: ('value' in c) ? c.value : 0 });
    });
    return out;
  }

  /**
   * 条件求值：变量不存在按 0 处理；全部条件 AND。
   * 返回 { ok, results:[{var,op,value,actual,pass}] }
   */
  function evalConditions(list) {
    const results = arr(list).map((c) => {
      const actual = (c.var in State.vars) ? State.vars[c.var] : 0;
      return { var: c.var, op: c.op, value: c.value, actual, pass: compareVars(actual, c.op, c.value) };
    });
    return { ok: results.every((r) => r.pass), results };
  }

  /** 单次比较；类型不可比时退回宽松比较，仍不可比则判不成立 */
  function compareVars(actual, op, expected) {
    if (op === '==') return looseEq(actual, expected);
    if (op === '!=') return !looseEq(actual, expected);
    const a = Number(actual), b = Number(expected);
    if (!Number.isFinite(a) || !Number.isFinite(b)) return false;
    if (op === '>=') return a >= b;
    if (op === '>') return a > b;
    if (op === '<=') return a <= b;
    if (op === '<') return a < b;
    return false;
  }
  /** 宽松相等：'1'==1、1==true、true=='true' 均成立（作者手写 JSON 常见写法） */
  function looseEq(a, b) {
    if (a === b) return true;
    if (typeof a === 'number' || typeof b === 'number') return Number(a) === Number(b);
    if (typeof a === 'boolean' || typeof b === 'boolean') return String(a) === String(b);
    return String(a) === String(b);
  }

  /** 条件可读化：affection.yuki >= 10 → 「affection.yuki ≥ 10」 */
  const OP_CN = { '>=': '≥', '>': '>', '<=': '≤', '<': '<', '==': '=', '!=': '≠' };
  function condText(c, withActual) {
    const op = OP_CN[str(c.op, '')] || str(c.op, '');
    const base = `${str(c.var, '')} ${op} ${fmtVar(c.value)}`;
    return withActual ? `${base}（当前 ${fmtVar(c.actual)}）` : base;
  }

  function normalizeData(raw) {
    const meta = obj(raw.meta);
    const theme = obj(meta.theme);
    const data = {
      meta: {
        title: str(meta.title, '未命名作品'),
        subtitle: str(meta.subtitle, ''),
        author: str(meta.author, ''),
        version: str(meta.version, ''),
        createdAt: str(meta.createdAt, ''),
        language: str(meta.language, 'zh-CN'),
        synopsis: str(meta.synopsis, ''),
        tags: arr(meta.tags).map((t) => str(t, '')).filter(Boolean),
        cover: typeof meta.cover === 'string' && meta.cover ? meta.cover : null,   // v2 封面图（data URL）
        affectionMax: Math.max(1, num(meta.affectionMax, 20)),                     // v2 好感度量程
        theme: {
          primary: str(theme.primary, '') || '#ff8fb1',
          accent: str(theme.accent, '') || '#8fb1ff',
          bg: str(theme.bg, '') || '#101425'
        }
      },
      characters: [],
      backgrounds: [],
      scenes: [],
      endings: [],
      start: str(raw.start, ''),
      warnings: []
    };

    // ---- 角色 ----
    arr(raw.characters).forEach((c, i) => {
      if (!c || typeof c !== 'object') { data.warnings.push(`characters[${i}] 不是对象，已跳过`); return; }
      const id = str(c.id, '');
      if (!id) { data.warnings.push(`characters[${i}] 缺少 id，已跳过`); return; }
      const ph = obj(c.placeholder);
      const grad = parseGradientColors(ph.gradient, null);
      data.characters.push({
        id,
        name: str(c.name, id),
        color: str(c.color, '') || data.meta.theme.primary,
        role: str(c.role, ''),
        profile: str(c.profile, ''),
        sprites: obj(c.sprites),
        // v2：好感度变量名（缺省约定 affection.<id>）与显示名
        affectionKey: str(c.affectionKey, '') || ('affection.' + id),
        affectionLabel: str(c.affectionLabel, '') || '好感度',
        placeholder: {
          emoji: str(ph.emoji, '👤'),
          gradient: str(ph.gradient, ''),
          colors: grad.colors,
          fallback: grad.colors.length ? '' : `linear-gradient(160deg,${data.meta.theme.primary},${data.meta.theme.accent})`
        }
      });
    });

    // ---- 背景 ----
    arr(raw.backgrounds).forEach((b, i) => {
      if (!b || typeof b !== 'object') { data.warnings.push(`backgrounds[${i}] 不是对象，已跳过`); return; }
      const id = str(b.id, '');
      if (!id) { data.warnings.push(`backgrounds[${i}] 缺少 id，已跳过`); return; }
      const image = typeof b.image === 'string' && b.image ? b.image : null;
      data.backgrounds.push({
        id,
        name: str(b.name, id),
        css: str(b.css, '') || `linear-gradient(180deg,${data.meta.theme.bg},#1c2140)`,
        image
      });
    });

    // ---- 场景 ----
    arr(raw.scenes).forEach((s, i) => {
      if (!s || typeof s !== 'object') { data.warnings.push(`scenes[${i}] 不是对象，已跳过`); return; }
      const id = str(s.id, '');
      if (!id) { data.warnings.push(`scenes[${i}] 缺少 id，已跳过`); return; }
      data.scenes.push({
        id,
        chapter: int(s.chapter, 0),
        name: str(s.name, id),
        background: str(s.background, ''),
        lines: arr(s.lines).filter((l) => l && typeof l === 'object')
      });
    });

    // ---- 结局 ----
    const KINDS = ['true', 'good', 'normal', 'bad'];
    arr(raw.endings).forEach((e, i) => {
      if (!e || typeof e !== 'object') { data.warnings.push(`endings[${i}] 不是对象，已跳过`); return; }
      const id = str(e.id, '');
      if (!id) { data.warnings.push(`endings[${i}] 缺少 id，已跳过`); return; }
      const kind = str(e.kind, 'normal');
      data.endings.push({
        id,
        title: str(e.title, '结局'),
        text: str(e.text, ''),
        kind: KINDS.indexOf(kind) >= 0 ? kind : 'normal',
        // v2：触发条件（数组内 AND；空数组/省略 = 无条件）
        condition: normalizeConditions(e.condition, `endings[${i}](${id})`)
      });
    });

    // ---- 索引表（快速查找） ----
    data.charMap = Object.create(null);
    data.characters.forEach((c) => { if (!(c.id in data.charMap)) data.charMap[c.id] = c; });
    data.bgMap = Object.create(null);
    data.backgrounds.forEach((b) => { if (!(b.id in data.bgMap)) data.bgMap[b.id] = b; });
    data.sceneMap = Object.create(null);
    data.scenes.forEach((s) => { if (!(s.id in data.sceneMap)) data.sceneMap[s.id] = s; });
    data.endingMap = Object.create(null);
    data.endings.forEach((e) => { if (!(e.id in data.endingMap)) data.endingMap[e.id] = e; });

    // ---- 契约自检（只提示，不阻断） ----
    if (!data.start || !data.sceneMap[data.start]) {
      data.warnings.push(`start 场景「${data.start || '空'}」不存在`);
      data.start = data.scenes.length ? data.scenes[0].id : '';
    }
    if (!data.characters.length) data.warnings.push('characters 为空：台词将只显示文本');
    if (!data.scenes.length) data.warnings.push('scenes 为空：无法开始游戏');
    data.scenes.forEach((s) => {
      if (s.background && !data.bgMap[s.background]) {
        data.warnings.push(`场景 ${s.id} 的背景「${s.background}」不存在，已回退默认背景`);
      }
      s.lines.forEach((l, li) => {
        if (str(l.type, '') === 'choice') {
          arr(l.options).forEach((o, oi) => {
            const oo = obj(o);
            if (!o || typeof o !== 'object') { data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 不是对象，已跳过`); return; }
            const g = str(oo.goto, '');
            // v2：goto / ending 都为空是合法的（顺延到下一个场景）
            if (g && !data.sceneMap[g]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 的 goto「${g}」不存在`);
            const en = str(oo.ending, '');
            if (en && !data.endingMap[en]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 的 ending「${en}」不存在`);
            const req = normalizeConditions(oo.require, `choice.require`);
            if (req.length !== arr(oo.require).length) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 的 require 有非法条件，已忽略`);
          });
        }
        if (str(l.type, '') === 'ending') {
          if (l.byCondition === true) {
            if (!data.endings.length) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行用了 byCondition，但没有任何结局定义`);
          } else {
            const eid = str(l.endingId, '');
            if (!eid || !data.endingMap[eid]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行的 endingId「${eid || '空'}」不存在`);
          }
        }
        if (str(l.type, '') === 'dialogue') {
          const sp = str(l.speaker, '');
          if (sp && !data.charMap[sp]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行的 speaker「${sp}」不存在`);
        }
        // v2 行级背景覆盖：id 不存在只提示，播放时自动沿用场景背景
        if (str(l.type, '') !== 'ending') {
          const lb = str(l.background, '');
          if (lb && !data.bgMap[lb]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行的 background「${lb}」不存在，已沿用场景背景`);
        }
      });
    });
    return data;
  }

  /* ==========================================================================
   * 模块 2 · Persist —— 设置 / 存档 / 图鉴 / 已读 的读写
   * ========================================================================== */
  const DEFAULT_SETTINGS = {
    textSpeed: 'medium',      // slow | medium | fast | instant
    fontSize: 'medium',       // small | medium | large
    autoPlay: false,
    autoInterval: 2200,       // ms
    skipRead: false           // 跳过已读（已读文本瞬间显示）
  };
  const SPEED_MS = { slow: 68, medium: 34, fast: 16, instant: 0 };

  const Persist = {
    readSettings() {
      const s = obj(LS.getJSON(KEY.settings, {}));
      const out = Object.assign({}, DEFAULT_SETTINGS);
      if (['slow', 'medium', 'fast', 'instant'].indexOf(s.textSpeed) >= 0) out.textSpeed = s.textSpeed;
      if (['small', 'medium', 'large'].indexOf(s.fontSize) >= 0) out.fontSize = s.fontSize;
      if (typeof s.autoPlay === 'boolean') out.autoPlay = s.autoPlay;
      if (typeof s.skipRead === 'boolean') out.skipRead = s.skipRead;
      const iv = num(s.autoInterval, DEFAULT_SETTINGS.autoInterval);
      out.autoInterval = Math.min(8000, Math.max(600, iv));
      return out;
    },
    writeSettings() { LS.setJSON(KEY.settings, State.settings); },

    readGallery() {
      const g = LS.getJSON(KEY.gallery, {});
      const out = {};
      if (g && typeof g === 'object' && !Array.isArray(g)) {
        Object.keys(g).forEach((k) => {
          const v = g[k];
          out[k] = { at: num(obj(v).at, 0), title: str(obj(v).title, '') };
        });
      }
      return out;
    },
    writeGallery() { LS.setJSON(KEY.gallery, State.gallery); },

    readSlot(i) {
      const o = LS.getJSON(KEY.slot(i), null);
      return o && typeof o === 'object' ? o : null;
    },
    readAuto() {
      const o = LS.getJSON(KEY.autosave, null);
      return o && typeof o === 'object' ? o : null;
    },

    readRead() {
      const r = LS.getJSON(KEY.read, []);
      const out = [];
      if (Array.isArray(r)) r.forEach((x) => { if (typeof x === 'string') out.push(x); });
      return out;
    },
    writeRead() {
      const list = Array.from(State.readSet);
      // 上限 4000 条，超出丢最早的，避免 localStorage 膨胀
      LS.setJSON(KEY.read, list.slice(-4000));
    }
  };

  /* 已读标记：用低成本哈希标识一行文本 */
  function lineHash(sceneId, idx, text) {
    const s = sceneId + '|' + idx + '|' + text;
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36);
  }

  /* ==========================================================================
   * 模块 3 · State —— 全局状态与 DOM 缓存
   * ========================================================================== */
  const SPEEDS = ['slow', 'medium', 'fast', 'instant'];
  const POSITIONS = ['left', 'center', 'right'];

  const el = {
    app: $('#app'),
    titleScreen: $('#title-screen'),
    titleMain: $('#title-main'),
    titleSub: $('#title-sub'),
    titleSynopsis: $('#title-synopsis'),
    titleTags: $('#title-tags'),
    titleFoot: $('#title-foot'),
    titleWarn: $('#title-warn'),
    btnStart: $('#btn-start'),
    btnContinue: $('#btn-continue'),
    btnGallery: $('#btn-gallery'),
    btnSettings: $('#btn-settings'),

    coverImage: $('#cover-image'),
    btnAffection: $('#btn-affection'),
    btnRotate: $('#btn-rotate'),
    rotateHint: $('#rotate-hint'),
    rotateHintTurn: $('#rotate-hint-turn'),
    rotateHintDismiss: $('#rotate-hint-dismiss'),

    gameScreen: $('#game-screen'),
    bgA: $('#bg-a'),
    bgB: $('#bg-b'),
    slot: { left: $('#slot-left'), center: $('#slot-center'), right: $('#slot-right') },
    chapterChip: $('#chapter-chip'),
    quickBar: $('.quick-bar'),
    qbLog: $('#qb-log'),
    qbAuto: $('#qb-auto'),
    qbSave: $('#qb-save'),
    qbMenu: $('#qb-menu'),
    dbox: $('#dialogue-box'),
    speaker: $('#speaker-name'),
    dtext: $('#dialogue-text'),
    mark: $('#advance-mark'),
    choiceList: $('#choice-list'),
    toast: $('#toast'),

    endingScreen: $('#ending-screen'),
    endingKind: $('#ending-kind'),
    endingTitle: $('#ending-title'),
    endingText: $('#ending-text'),
    endingCond: $('#ending-cond'),
    endingVars: $('#ending-vars'),
    btnEndingTitle: $('#btn-ending-title'),
    btnEndingGallery: $('#btn-ending-gallery'),

    modalRoot: $('#modal-root')
  };

  const State = {
    data: null,
    dataErr: '',
    hasSave: false,

    settings: Persist.readSettings(),
    gallery: Persist.readGallery(),
    readSet: new Set(Persist.readRead()),

    phase: 'title',            // title | line | choice | ending
    playMode: 'title',         // title | game | ending（控制显示哪一层屏幕）
    modal: null,               // 当前打开的面板名
    modalReturnFocus: null,
    uiLocked: false,           // 模态打开时禁止推进
    fatal: '',                 // 致命错误文案（写入标题屏提示）

    sceneId: '',
    sceneIdx: -1,
    lineIdx: -1,
    currentLine: null,
    bgId: '',                  // 当前生效的背景 id（含行级 background 覆盖）
    vars: {},
    sprites: {},               // pos -> { charId, key, pose }
    history: [],               // [{ name, color, text, narr }]
    pendingChoice: null,
    choiceOptions: [],
    endingVarsSnapshot: null,
    endedId: '',
    visitedOrder: [],          // 本次游玩经过的场景 id
    steps: 0
  };
  const Runtime = {
    bgVisible: 'a',
    bgCurrent: '',            // 当前已生效的背景 id（存档 / 行级覆盖用）
    bgRendered: '',           // 当前**已渲染**的背景 id（去重用，与 bgCurrent 含义不同）
    bgScene: '',              // 当前场景自身的背景 id
    bgSourceScene: '',        // 决定"当前背景"的那一行所属场景 id
    bgSourceSceneBg: '',      // 该场景自身的背景 id（判断是否被行级覆盖）
    bgRev: 0,                 // 背景切换次数（便于自动化断言"确实换了背景"）
    type: { raf: 0, full: '', shown: 0, done: true, timer: 0 },
    autoTimer: 0,
    autoTextTimer: 0,
    toastTimer: 0
  };

  const hasSaveData = () => !!(Persist.readAuto() || [1, 2, 3].some((i) => Persist.readSlot(i)));

  /* ==========================================================================
   * 模块 4 · Render —— 主题 / 背景 / 立绘 / 对话 / 结局 / 面板
   * ========================================================================== */
  function applyTheme() {
    const t = State.data ? State.data.meta.theme : { primary: '#ff8fb1', accent: '#8fb1ff', bg: '#101425' };
    const r = document.documentElement.style;
    r.setProperty('--cg-primary', t.primary);
    r.setProperty('--cg-accent', t.accent);
    r.setProperty('--cg-bg', t.bg);
    r.setProperty('--cg-primary-soft', hexToRgba(t.primary, 0.2));
    r.setProperty('--cg-accent-soft', hexToRgba(t.accent, 0.2));
  }
  /** #rgb / #rrggbb → rgba()；非 hex 原样返回（允许直接写颜色关键字） */
  function hexToRgba(color, alpha) {
    const s = str(color, '');
    const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(s.trim());
    if (!m) return s || 'rgba(255,143,177,' + alpha + ')';
    let hex = m[1];
    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    const n = parseInt(hex, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
  }
  function applyFontSize() { document.documentElement.setAttribute('data-fontsize', State.settings.fontSize); }

  /* ---------------------------- 屏幕切换 ---------------------------- */
  function showScreen(name) {
    State.playMode = name;
    el.titleScreen.classList.toggle('hidden', name !== 'title');
    el.gameScreen.classList.toggle('hidden', name !== 'game');
    el.endingScreen.classList.toggle('hidden', name !== 'ending');
    document.documentElement.setAttribute('data-screen', name);
  }

  function toast(msg, ms) {
    if (!el.toast) return;
    el.toast.textContent = str(msg, '');
    el.toast.classList.add('on');
    clearTimeout(Runtime.toastTimer);
    Runtime.toastTimer = setTimeout(() => el.toast.classList.remove('on'), num(ms, 1800));
  }

  /* ---------------------------- 背景渲染 ---------------------------- */
  /** 按 id 取背景对象；id 非法时不回退（由调用方决定回退策略） */
  function bgById(bgId) {
    const d = State.data;
    if (!d || !bgId) return null;
    return d.bgMap[bgId] || null;
  }
  /** 通用回退：非法/缺失时用第一个背景；完全没背景则返回 null */
  function resolveBackground(bgId) {
    const d = State.data;
    if (!d) return null;
    return bgById(bgId) || d.backgrounds[0] || null;
  }
  /**
   * 应用背景（交叉淡入淡出）；返回真正显示出来的背景对象。
   * 关键：与「当前**已渲染**的背景」相同则直接返回，避免同一场景/同一背景重复切换。
   */
  function applyBackground(bgId) {
    const bg = resolveBackground(bgId);
    const wantId = bg ? bg.id : '';
    // 已经画着同一个背景 → 不重复切换（背景层也不翻转）
    if (wantId && wantId === Runtime.bgRendered) return bg;
    const css = bg && bg.image
      ? { image: bg.image, css: bg.css }
      : { image: null, css: bg ? bg.css : State.data.meta.theme.bg };
    const cur = Runtime.bgVisible === 'a' ? el.bgA : el.bgB;
    const next = Runtime.bgVisible === 'a' ? el.bgB : el.bgA;
    const styleOf = (node) => {
      if (css.image) { node.style.background = ''; node.style.backgroundImage = `url("${css.image}")`; }
      else { node.style.backgroundImage = 'none'; node.style.background = css.css; }
    };
    // 首个背景：直接显示，不做黑场闪烁
    if (!cur.classList.contains('active')) {
      styleOf(cur); cur.classList.add('active');
      Runtime.bgRendered = wantId;
      Runtime.bgCurrent = wantId;
      Runtime.bgRev++;
      return bg;
    }
    styleOf(next);
    next.classList.add('active');
    cur.classList.remove('active');
    Runtime.bgVisible = Runtime.bgVisible === 'a' ? 'b' : 'a';
    Runtime.bgRendered = wantId;
    Runtime.bgCurrent = wantId;
    Runtime.bgRev++;
    return bg;
  }

  /**
   * v2 行级背景覆盖：非 ending 的行可带 background 字段。
   * - 该行有合法 background → 用它
   * - 该行有 background 但 id 非法 → 忽略该字段，**保持当前背景不变**
   * - 该行没有 background → 回到所在场景的背景
   * 顺带更新 State.bgId（存档记录的就是"当时背景"）。
   */
  function applyLineBackground(line) {
    const sc = currentSceneSafe();
    const hasField = line && typeof line === 'object' && str(line.background, '') !== '';
    const lineBg = hasField ? str(line.background, '') : '';
    let want = '';
    if (hasField) {
      // 合法 id 用行级背景；非法 id 视为"保持现状"（契约由后端校验兜底）
      want = bgById(lineBg) ? lineBg : Runtime.bgCurrent;
    } else {
      want = sc ? sc.background : '';
    }
    const bg = applyBackground(want);
    State.bgId = bg ? bg.id : want;
    // 记录"当前背景由哪一行的场景/行级覆盖决定"，供调试接口判断来源
    Runtime.bgSourceScene = sc ? sc.id : '';
    Runtime.bgSourceSceneBg = sc ? sc.background : '';
    return bg;
  }
  /** 供 applyLineBackground 使用的当前场景（避免与 currentScene 的声明顺序耦合） */
  function currentSceneSafe() {
    return (State.data && State.data.sceneMap[State.sceneId]) || null;
  }

  /* ---------------------------- 立绘渲染 ---------------------------- */
  const spriteCache = new Map(); // charId|key -> HTML 片段

  function spriteMarkup(ch) {
    const key = str(ch.key, 'default');
    const cacheKey = ch.id + '|' + key;
    if (spriteCache.has(cacheKey)) return spriteCache.get(cacheKey);
    const src = str(obj(ch.sprites)[key], '') || str(obj(ch.sprites)['default'], '');
    let html;
    if (src) {
      html = `<div class="sprite-inner"><img class="sprite-img" alt="${esc(ch.name)}" src="${esc(src)}"></div>`;
    } else {
      // 回退：emoji + 渐变占位（sprites 为空对象时的必备路径）
      const ph = obj(ch.placeholder);
      const colors = arr(ph.colors);
      const bg = str(ph.gradient, '') || str(ph.fallback, '') || `linear-gradient(160deg,${State.data.meta.theme.primary},${State.data.meta.theme.accent})`;
      const grains = colors.length
        ? `<div class="sprite-grain" aria-hidden="true">${colors.map((c) => `<i style="background:${esc(c)}"></i>`).join('')}</div>`
        : '';
      html = `<div class="sprite-inner">${grains}`
        + `<div class="sprite-placeholder" style="background:${esc(bg)}">`
        + `<span class="sprite-emoji">${esc(str(ph.emoji, '👤'))}</span></div>`
        + `<span class="sprite-name">${esc(ch.name)}</span></div>`;
    }
    spriteCache.set(cacheKey, html);
    return html;
  }

  function spriteEntry(pos) { return State.sprites[pos] || null; }

  /** 真正绘制到 slot：animate=true 播放入场动画 */
  function drawSprite(pos, entry, animate) {
    const slot = el.slot[pos];
    if (!slot) return;
    if (!entry) {
      if (slot.childElementCount) {
        slot.classList.remove('in');
        const old = slot;
        setTimeout(() => { if (!spriteEntry(pos)) { old.innerHTML = ''; old.classList.remove('leaving'); } }, 340);
      }
      return;
    }
    const ch = State.data.charMap[entry.charId];
    if (!ch) return;
    const sig = entry.charId + '|' + str(entry.key, 'default');
    const changed = slot.getAttribute('data-sig') !== sig;
    if (changed) {
      slot.innerHTML = spriteMarkup({ id: ch.id, name: ch.name, sprites: ch.sprites, placeholder: ch.placeholder, key: entry.key });
      slot.setAttribute('data-sig', sig);
    }
    slot.classList.remove('leaving');
    if (animate) {
      slot.classList.remove('in');
      void slot.offsetWidth;  // 强制重排，让 transition 重新生效
      slot.classList.add('in');
    } else {
      slot.classList.add('in');
    }
  }

  function setSprite(pos, charId, key, pose, animate) {
    if (POSITIONS.indexOf(pos) < 0) pos = 'center';
    State.sprites[pos] = { charId, key: str(key, 'default'), pose: str(pose, 'center') };
    drawSprite(pos, State.sprites[pos], animate !== false);
  }

  function removeSprite(pos, animate) {
    if (POSITIONS.indexOf(pos) < 0) return;
    State.sprites[pos] = null;
    const slot = el.slot[pos];
    if (!slot) return;
    if (animate === false) { slot.innerHTML = ''; slot.classList.remove('in', 'leaving'); return; }
    slot.classList.add('leaving');
    slot.classList.remove('in');
    setTimeout(() => {
      if (!spriteEntry(pos)) { slot.innerHTML = ''; slot.classList.remove('leaving'); }
    }, 400);
  }

  function clearSprites() {
    POSITIONS.forEach((p) => { State.sprites[p] = null; const s = el.slot[p]; if (s) { s.innerHTML = ''; s.classList.remove('in', 'leaving'); } });
  }

  /** 立绘状态快照（存档用） */
  function spriteSnapshot() {
    const out = {};
    POSITIONS.forEach((p) => { const s = spriteEntry(p); if (s) out[p] = { charId: s.charId, key: s.key, pose: s.pose }; });
    return out;
  }
  /** 从存档恢复立绘（无动画） */
  function restoreSprites(snap) {
    clearSprites();
    const s = obj(snap);
    POSITIONS.forEach((p) => {
      const v = obj(s[p]);
      if (!v.charId || !State.data.charMap[v.charId]) return;
      State.sprites[p] = { charId: str(v.charId, ''), key: str(v.key, 'default'), pose: str(v.pose, 'center') };
      drawSprite(p, State.sprites[p], false);
    });
  }

  /* ---------------------------- 对话渲染 ---------------------------- */
  function clearAutoTimers() {
    clearTimeout(Runtime.autoTimer); Runtime.autoTimer = 0;
    clearTimeout(Runtime.autoTextTimer); Runtime.autoTextTimer = 0;
  }
  function stopTypewriter() {
    if (Runtime.type.raf) cancelAnimationFrame(Runtime.type.raf);
    Runtime.type.raf = 0;
  }
  function speedMs() {
    const v = SPEED_MS[State.settings.textSpeed];
    return typeof v === 'number' ? v : SPEED_MS.medium;
  }

  /** 打字机；instant=true 或速度档为 instant 时立即完成 */
  function typeText(text, instant) {
    const full = str(text, '');
    stopTypewriter();
    Runtime.type.full = full;
    Runtime.type.shown = 0;
    el.dtext.textContent = '';
    const ms = instant ? 0 : speedMs();
    if (!full) { finishType(); return; }
    if (ms <= 0) { el.dtext.textContent = full; Runtime.type.shown = full.length; finishType(); return; }
    Runtime.type.done = false;
    el.mark.classList.remove('on');
    // 先同步写出首字，保证任何时刻读取 dialogue-text 都能看到内容随时间增长
    Runtime.type.shown = 1;
    el.dtext.textContent = full.slice(0, 1);
    let last = performance.now();
    let acc = 0;
    const step = (now) => {
      const dt = now - last; last = now;
      acc += dt;
      const n = Math.floor(acc / ms);
      if (n > 0) {
        acc -= n * ms;
        Runtime.type.shown = Math.min(full.length, Runtime.type.shown + n);
        el.dtext.textContent = full.slice(0, Runtime.type.shown);
        if (Runtime.type.shown >= full.length) { finishType(); return; }
      }
      Runtime.type.raf = requestAnimationFrame(step);
    };
    Runtime.type.raf = requestAnimationFrame(step);
  }
  function finishType() {
    stopTypewriter();
    Runtime.type.shown = Runtime.type.full.length;
    Runtime.type.done = true;
    el.dtext.textContent = Runtime.type.full;
    el.mark.classList.add('on');
    scheduleAuto();
  }
  /** 若正在打字则先补全，返回是否发生过“补全” */
  function completeTypeIfNeeded() {
    if (Runtime.type.done) return false;
    finishType();
    return true;
  }

  function setSpeaker(ch) {
    if (!ch) { el.speaker.classList.add('hidden'); el.speaker.textContent = ''; return; }
    el.speaker.classList.remove('hidden');
    el.speaker.textContent = ch.name;
    el.speaker.style.color = ch.color;
    el.speaker.style.borderColor = hexToRgba(ch.color, 0.55);
    el.speaker.style.background = hexToRgba(ch.color, 0.16);
  }

  /** 渲染一条 narration / dialogue */
  function renderTextLine(line) {
    const type = str(line.type, '');
    if (type === 'narration') {
      el.dbox.setAttribute('data-narration', '1');
      setSpeaker(null);
      return str(line.text, '');
    }
    if (type !== 'dialogue') {
      // 未知类型：不进入对话流程（由 execLine 跳过）
      el.dbox.setAttribute('data-narration', '0');
      setSpeaker(null);
      return str(line.text, '');
    }
    el.dbox.setAttribute('data-narration', '0');
    const chId = str(line.speaker, '');
    const ch = State.data.charMap[chId] || null;
    setSpeaker(ch || { id: chId || 'unknown', name: chId || '???', color: State.data.meta.theme.accent });

    const pos = POSITIONS.indexOf(str(line.pose, 'center')) >= 0 ? str(line.pose, 'center') : 'center';
    const key = str(line.sprite, 'default') || 'default';
    if (line.exit === true) {
      removeSprite(pos, true);
    } else if (ch) {
      setSprite(pos, ch.id, key, pos, true);
    }
    return str(line.text, '');
  }

  /* ---------------------------- 选项渲染 ---------------------------- */
  function renderChoice(line) {
    // 过滤掉非法选项，并把“过滤后的列表”存起来，保证下标与点击结果一致
    const all = arr(line.options).filter((o) => o && typeof o === 'object');
    // v2：require 不满足的选项直接不显示
    const options = all.filter((o) => {
      const req = normalizeConditions(o.require, 'choice.require');
      return !req.length || evalConditions(req).ok;
    });
    State.choiceOptions = options;
    const prompt = str(line.prompt, '');
    el.choiceList.innerHTML = '';
    if (prompt) {
      const p = document.createElement('div');
      p.className = 'choice-prompt';
      p.textContent = prompt;
      el.choiceList.appendChild(p);
    }
    const hiddenCount = all.length - options.length;
    options.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'choice-btn';
      b.type = 'button';
      b.setAttribute('data-choice-index', String(i));
      const hint = str(o.hint, '');
      b.innerHTML = `<span class="choice-idx">${i + 1}</span>${esc(str(o.text, '选项 ' + (i + 1)))}`
        + (hint ? `<span class="choice-hint">${esc(hint)}</span>` : '');
      b.addEventListener('click', (ev) => { ev.stopPropagation(); pickChoice(i); });
      el.choiceList.appendChild(b);
    });
    if (!options.length) {
      const tip = document.createElement('button');
      tip.className = 'choice-btn';
      tip.type = 'button';
      tip.textContent = hiddenCount
        ? `（${hiddenCount} 个选项条件不满足，点击继续）`
        : '（本行没有可用选项，点击继续）';
      tip.setAttribute('data-choice-skip', '1');
      tip.addEventListener('click', (ev) => {
        ev.stopPropagation();
        el.dbox.removeAttribute('data-choice');
        hideChoice();
        State.phase = 'line';
        State.pendingChoice = null;
        State.lineIdx++;
        execLine();
      });
      el.choiceList.appendChild(tip);
    }
    el.choiceList.classList.remove('hidden');
    requestAnimationFrame(positionChoiceList);
  }

  /**
   * 让选项列表尽量落在“立绘之下的空档”里：
   * 若居中位置会压到对话框，就整体上移到对话框上沿之上（同时避免顶出画面）
   */
  function positionChoiceList() {
    if (el.choiceList.classList.contains('hidden')) return;
    el.choiceList.style.setProperty('--choice-lift', '0px');
    const app = el.app.getBoundingClientRect();
    const listH = el.choiceList.offsetHeight;
    const dboxTop = el.dbox.getBoundingClientRect().top - app.top;
    const centerTop = (app.height - listH) / 2;
    const margin = 14;
    let lift = 0;
    if (centerTop + listH > dboxTop - margin) lift = (centerTop + listH) - (dboxTop - margin);
    const maxLift = centerTop - 44;              // 顶部至少留出 44px（章节点/工具条）
    if (maxLift > 0) lift = Math.min(lift, maxLift);
    el.choiceList.style.setProperty('--choice-lift', Math.max(0, Math.round(lift)) + 'px');
  }
  function hideChoice() {
    el.choiceList.classList.add('hidden');
    el.choiceList.innerHTML = '';
    State.choiceOptions = [];
    el.dbox.removeAttribute('data-choice');
    el.gameScreen.removeAttribute('data-phase');
  }

  /* ---------------------------- 结局渲染 ---------------------------- */
  function renderEnding(endingIdOrData, matched) {
    const d = State.data;
    let e = null;
    if (endingIdOrData && typeof endingIdOrData === 'object') e = endingIdOrData;
    else e = d.endingMap[str(endingIdOrData, '')] || null;
    if (!e) {
      e = { id: str(endingIdOrData, 'unknown'), title: '未知结局', text: '数据中找不到该结局定义。', kind: 'normal', condition: [] };
    }
    State.endedId = e.id;
    State.endingVarsSnapshot = clone(State.vars) || {};
    // 记录图鉴
    State.gallery[e.id] = { at: Date.now(), title: e.title };
    Persist.writeGallery();
    // 展示
    el.endingScreen.setAttribute('data-kind', e.kind);
    el.endingKind.textContent = ({ true: 'True End', good: 'Good End', normal: 'Normal End', bad: 'Bad End' })[e.kind] || 'Ending';
    el.endingTitle.textContent = e.title;
    el.endingText.textContent = e.text;
    // v2：回显触发条件（byCondition 时显示命中的条件；直接指定时显示该结局的 condition）
    const conds = e.condition || [];
    const shown = arr(matched).length ? arr(matched)
      : conds.map((c) => ({ var: c.var, op: c.op, value: c.value, actual: (c.var in State.vars) ? State.vars[c.var] : 0 }));
    if (shown.length) {
      el.endingCond.classList.remove('hidden');
      el.endingCond.textContent = '触发条件：' + shown.map((c) => condText(c, true)).join(' 且 ');
    } else {
      el.endingCond.classList.add('hidden');
      el.endingCond.textContent = '';
    }
    const keys = Object.keys(State.endingVarsSnapshot);
    if (keys.length) {
      el.endingVars.classList.remove('hidden');
      el.endingVars.textContent = '变量：' + keys.sort().map((k) => `${k}=${fmtVar(State.endingVarsSnapshot[k])}`).join(' · ');
    } else {
      el.endingVars.classList.add('hidden');
      el.endingVars.textContent = '';
    }
    State.phase = 'ending';
    clearAutoTimers();
    stopTypewriter();
    hideChoice();
    showScreen('ending');
    updateAutoButton();
    // 结局后清空自动存档，避免“继续游戏”回到已结束的流程
    LS.del(KEY.autosave);
    refreshContinueButton();
  }
  function fmtVar(v) {
    if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(Math.round(v * 1000) / 1000);
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    return str(v, '');
  }

  /* ---------------------------- 模态面板 ---------------------------- */
  function closeModal() {
    State.modal = null;
    State.uiLocked = false;
    el.modalRoot.innerHTML = '';
    updateAutoButton();
  }
  function openModal(name, titleText, bodyHTML, footButtons) {
    State.modal = name;
    State.uiLocked = true;
    clearAutoTimers();
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.setAttribute('data-modal', name);
    const foot = (footButtons || []).map((b, i) =>
      `<button class="btn ${b.main ? 'btn-main' : 'btn-ghost'} btn-sm" data-foot-index="${i}">${esc(b.label)}</button>`).join('');
    wrap.innerHTML = `<div class="panel" data-testid="panel-${esc(name)}" role="dialog" aria-label="${esc(titleText)}">
        <div class="panel-head">
          <h3 class="panel-title">${esc(titleText)}</h3>
          <button class="btn btn-ghost btn-sm" data-modal-close="1">关闭</button>
        </div>
        <div class="panel-body">${bodyHTML}</div>
        ${foot ? `<div class="panel-foot">${foot}</div>` : ''}
      </div>`;
    el.modalRoot.innerHTML = '';
    el.modalRoot.appendChild(wrap);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) closeModal(); });
    wrap.querySelector('[data-modal-close]').addEventListener('click', closeModal);
    (footButtons || []).forEach((b, i) => {
      const btn = wrap.querySelector(`[data-foot-index="${i}"]`);
      if (btn && typeof b.onClick === 'function') btn.addEventListener('click', () => b.onClick());
    });
    if (typeof (footButtons || []).onMount === 'function') footButtons.onMount(wrap);
    return wrap;
  }

  /* 通用分段选择器 HTML */
  function segHTML(field, options, current) {
    return `<div class="seg" data-seg="${esc(field)}">${options.map((o) =>
      `<button class="seg-btn${o.value === current ? ' on' : ''}" data-seg-field="${esc(field)}" data-seg-value="${esc(o.value)}">${esc(o.label)}</button>`
    ).join('')}</div>`;
  }

  /* ==========================================================================
   * 模块 5 · Engine —— effects / 行执行 / 跳转
   * ========================================================================== */
  const FALLBACK_BG = { id: '__fallback__', name: '未知背景', css: '', image: null };

  /** effects 语义：number 累加；boolean / string 赋值；key 含 . 表示命名空间变量 */
  function applyEffects(effects) {
    const e = obj(effects);
    Object.keys(e).forEach((k) => {
      const v = e[k];
      if (typeof v === 'number' && Number.isFinite(v)) {
        const cur = State.vars[k];
        State.vars[k] = (typeof cur === 'number' && Number.isFinite(cur) ? cur : 0) + v;
      } else if (typeof v === 'boolean' || typeof v === 'string') {
        State.vars[k] = v;
      } else if (v === null) {
        State.vars[k] = null;
      } else {
        State.vars[k] = clone(v); // 其他类型（数组/对象）整体赋值，保持数据不丢
      }
    });
  }

  function currentScene() { return State.data.sceneMap[State.sceneId] || null; }

  /** 进入场景（含背景切换 + 可选自动存档） */
  function enterScene(sceneId, lineIdx, opts) {
    opts = obj(opts);
    const sc = State.data.sceneMap[sceneId] || null;
    if (!sc) return false;
    clearAutoTimers();
    stopTypewriter();
    State.sceneId = sc.id;
    State.sceneIdx = State.data.scenes.indexOf(sc);
    State.lineIdx = int(lineIdx, 0);
    if (!State.visitedOrder.length || State.visitedOrder[State.visitedOrder.length - 1] !== sc.id) State.visitedOrder.push(sc.id);
    // 先用场景背景落地；若落点这一行带 background 覆盖，立即切过去（读档落在覆盖行上也正确）
    Runtime.bgScene = sc.background;
    const bg = applyBackground(sc.background);
    State.bgId = bg ? bg.id : sc.background;
    const landLine = sc.lines[int(lineIdx, 0)];
    if (landLine && typeof landLine === 'object' && str(landLine.background, '')) applyLineBackground(landLine);
    el.chapterChip.textContent = sc.name;
    el.chapterChip.classList.toggle('hidden', !sc.name);
    if (opts.autosave !== false) autoSave();
    return true;
  }

  /** 行签名（已读 / 存档用） */
  function lineSignature(line, idx) {
    const t = str(line && line.type, '');
    const txt = str(line && line.text, '');
    return lineHash(State.sceneId, typeof idx === 'number' ? idx : State.lineIdx, t + ':' + txt + ':' + str(line && line.endingId, ''));
  }

  /** 执行当前行；set / 未知类型会自动向前推进 */
  function execLine() {
    const sc = currentScene();
    if (!sc) { fatal('当前场景不存在，已返回标题'); return; }
    if (State.lineIdx < 0) State.lineIdx = 0;
    if (State.lineIdx >= sc.lines.length) { nextScene(); return; }
    if (++State.steps > 20000) { fatal('剧本执行步数异常，已停止'); return; }

    const line = sc.lines[State.lineIdx] || {};
    State.currentLine = line;
    const type = str(line.type, '');

    // v2 行级背景覆盖：非 ending 的行在渲染前先确定背景（含淡入淡出切换）
    if (type !== 'ending') applyLineBackground(line);

    if (type === 'narration' || type === 'dialogue') {
      State.phase = 'line';
      hideChoice();
      const text = renderTextLine(line);
      const sig = lineSignature(line, State.lineIdx);
      const isRead = State.readSet.has(sig);
      if (!isRead) { State.readSet.add(sig); Persist.writeRead(); }
      pushHistory(line, text);
      const instant = isRead && State.settings.skipRead;
      typeText(text, instant);
      return;
    }
    if (type === 'set') {
      applyEffects(line.effects);
      if (State.settings.skipRead) { skipForward(); return; }
      State.lineIdx++;
      setTimeout(() => { if (State.phase === 'line' || State.phase === 'choice') execLine(); }, 0);
      return;
    }
    if (type === 'choice') {
      State.phase = 'choice';
      State.pendingChoice = line;
      State.lineIdx = State.lineIdx; // 存档仍停在本行
      renderChoiceFor(line);
      autoSave();
      return;
    }
    if (type === 'ending') {
      // v2：byCondition → 按 endings[] 顺序取第一个条件全满足的结局
      if (line.byCondition === true) {
        const picked = resolveEndingByCondition();
        if (picked.ending) { renderEnding(picked.ending, picked.matched); return; }
        toast('没有任何结局定义，已返回标题');
        backToTitle('剧本没有定义任何结局');
        return;
      }
      const eid = str(line.endingId, '');
      renderEnding(State.data.endingMap[eid] || { id: eid || 'unknown', title: '未知结局', text: 'endingId 未在 endings 中定义。', kind: 'normal' });
      return;
    }
    // 未知 line 类型：直接跳过
    State.lineIdx++;
    setTimeout(() => { if (State.phase === 'line' || State.phase === 'choice') execLine(); }, 0);
  }

  /**
   * v2 条件结局判定：
   *  1) 按 endings[] 顺序取第一个「有 condition 且全部满足」的结局
   *  2) 都不满足 → 取第一个没有 condition 的结局
   *  3) 仍没有 → endings[0]
   * 返回 { ending, matched }（matched 为命中的条件明细，供结局画面回显）
   */
  function resolveEndingByCondition() {
    const list = State.data.endings;
    if (!list.length) return { ending: null, matched: [] };
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.condition.length) continue;
      const r = evalConditions(e.condition);
      if (r.ok) return { ending: e, matched: r.results };
    }
    for (let i = 0; i < list.length; i++) {
      if (!list[i].condition.length) return { ending: list[i], matched: [] };
    }
    return { ending: list[0], matched: [] };
  }

  function renderChoiceFor(line) {
    // 选项文字由 #choice-list 呈现；对话框只保留“请选择”氛围提示，避免文字重复
    el.dbox.setAttribute('data-narration', '0');
    el.dbox.setAttribute('data-choice', '1');
    setSpeaker(null);
    typeText('请选择…', true);
    el.gameScreen.setAttribute('data-phase', 'choice');
    renderChoice(line);
  }

  /** 前往下一个场景（当前场景行耗尽） */
  function nextScene() {
    const d = State.data;
    const idx = State.sceneIdx;
    if (idx + 1 < d.scenes.length) {
      enterScene(d.scenes[idx + 1].id, 0);
      execLine();
      return;
    }
    // 没有显式 ending：用最后一个可用结局收尾
    if (d.endings.length) { renderEnding(d.endings[0]); return; }
    fatal('剧本已结束，但没有定义任何 ending。');
  }

  /** 推进：补全文字 → 下一行 */
  function advance() {
    if (State.uiLocked || State.modal) return;
    if (State.phase === 'choice') return;      // 选项阶段必须点击选项
    if (State.phase === 'ending') return;
    if (State.phase !== 'line') return;
    clearAutoTimers();
    if (completeTypeIfNeeded()) return;        // 文本未打完：先补全
    State.lineIdx++;
    execLine();
  }

  /** 跳过模式下连续推进（用于 set 与已读快速跳过） */
  function skipForward() {
    let guard = 0;
    while (guard++ < 400) {
      const sc = currentScene();
      if (!sc || State.lineIdx >= sc.lines.length) { nextScene(); return; }
      const line = sc.lines[State.lineIdx] || {};
      const t = str(line.type, '');
      // 被跳过的行同样要落地它的行级背景覆盖，否则跳过后的画面会与契约不一致
      if (t !== 'ending') applyLineBackground(line);
      if (t === 'set') { applyEffects(line.effects); State.lineIdx++; continue; }
      if (t === 'narration' || t === 'dialogue') {
        const sig = lineSignature(line, State.lineIdx);
        if (State.readSet.has(sig)) { State.lineIdx++; continue; }
      }
      execLine();
      return;
    }
  }

  /** 选择分支：应用 effects → ending 优先，其次 goto，都为空则顺延到下一个场景 */
  function pickChoice(i) {
    const line = State.pendingChoice;
    if (!line) return;
    const options = arr(State.choiceOptions);
    if (i < 0 || i >= options.length) { toast('该选项不存在'); return; }
    const o = obj(options[i]);
    applyEffects(o.effects);
    hideChoice();
    State.pendingChoice = null;

    // v2：options[].ending 非空 → 直接进入该结局（忽略 goto）
    const endingId = str(o.ending, '');
    if (endingId) {
      const e = State.data.endingMap[endingId];
      State.phase = 'line';
      if (e) { renderEnding(e); return; }
      toast(`结局「${endingId}」未定义，已按剧本顺延`);
      // 落到 goto / 顺延逻辑
    }

    const goto = str(o.goto, '');
    if (goto && State.data.sceneMap[goto]) {
      State.phase = 'line';
      enterScene(goto, 0);
      execLine();
      return;
    }
    if (goto) {
      toast(`选项指向的场景「${goto}」不存在，已顺延到下一个场景`);
    }
    // v2：goto 与 ending 都为空（或目标不存在）→ 顺延到下一个场景，不报错
    State.phase = 'line';
    nextScene();
  }

  /** 历史记录 */
  function pushHistory(line, text) {
    const t = str(line.type, '');
    const ch = t === 'dialogue' ? (State.data.charMap[str(line.speaker, '')] || null) : null;
    State.history.push({
      name: ch ? ch.name : (t === 'dialogue' ? str(line.speaker, '???') : '旁白'),
      color: ch ? ch.color : '',
      text: str(text, ''),
      narr: t === 'narration'
    });
    if (State.history.length > 400) State.history.splice(0, State.history.length - 400);
  }

  /* ==========================================================================
   * 模块 6 · Save / Load
   * ========================================================================== */
  function buildSave() {
    const sc = currentScene();
    return {
      v: 1,
      at: Date.now(),
      title: State.data.meta.title,
      sceneId: State.sceneId,
      lineIdx: Math.max(0, State.lineIdx),
      sceneName: sc ? sc.name : '',
      vars: clone(State.vars) || {},
      sprites: spriteSnapshot(),
      // bgId = 存档那一刻真正显示的背景（可能是行级 background 覆盖的结果）
      bgId: State.bgId || (sc ? sc.background : ''),
      sceneBgId: sc ? sc.background : '',
      varsCount: Object.keys(State.vars).length,
      progress: State.visitedOrder.length
    };
  }
  function slotSummary(s) {
    if (!s) return { name: '空存档位', meta: '尚无记录', empty: true };
    const scName = str(s.sceneName, '') || str(s.sceneId, '');
    return {
      name: scName || '（未知场景）',
      meta: `${fmtTime(s.at)} · 变量 ${int(s.varsCount, 0)} 项`,
      empty: false
    };
  }
  function autoSave() {
    if (!State.data || State.dataErr) return;
    if (State.phase === 'title' || State.phase === 'ending') return;
    if (!currentScene()) return;
    LS.setJSON(KEY.autosave, buildSave());
    refreshContinueButton();
  }
  function saveToSlot(i) {
    if (!State.data) return false;
    if (!currentScene()) { toast('当前无可存档进度'); return false; }
    LS.setJSON(KEY.slot(i), buildSave());
    State.hasSave = true;
    refreshContinueButton();
    toast(`已存入槽位 ${i}`);
    return true;
  }
  function loadFrom(save) {
    const s = obj(save);
    if (!s.sceneId || !State.data.sceneMap[str(s.sceneId, '')]) { toast('存档已损坏：场景不存在'); return false; }
    State.vars = obj(clone(s.vars));
    State.history = [];
    State.pendingChoice = null;
    State.visitedOrder = [str(s.sceneId, '')];
    State.steps = 0;
    closeModal();
    showScreen('game');
    clearSprites();
    const ok = enterScene(str(s.sceneId, ''), Math.max(0, int(s.lineIdx, 0)), { autosave: false });
    if (!ok) { toast('存档已损坏：场景不存在'); backToTitle('存档损坏'); return false; }
    // 背景：先按落点这一行 / 场景确定（enterScene 已处理行级覆盖），
    // 再用存档里记录的“当时背景”兜底（兼容旧存档与脚本改动）。
    const sc = currentScene();
    const saveBg = str(s.bgId, '');
    if (saveBg && bgById(saveBg) && saveBg !== Runtime.bgCurrent) {
      const bg = applyBackground(saveBg);
      State.bgId = bg ? bg.id : saveBg;
    } else if (sc && !State.bgId) {
      State.bgId = sc.background;
    }
    restoreSprites(s.sprites);
    State.phase = 'line';
    // 从存档行继续执行（选项行会重新给出选项）
    execLine();
    updateAutoButton();
    toast('读取成功');
    return true;
  }

  function refreshContinueButton() {
    const auto = Persist.readAuto();
    const anySlot = [1, 2, 3].map((i) => Persist.readSlot(i)).filter(Boolean);
    State.hasSave = !!(auto || anySlot.length);
    el.btnContinue.disabled = !State.hasSave;
    el.btnContinue.title = State.hasSave ? `自动存档：${fmtTime(auto ? auto.at : (anySlot[0] && anySlot[0].at))}` : '暂无可读存档';
  }

  /* ==========================================================================
   * 模块 7 · Screens —— 标题 / 开始 / 回标题 / 面板内容
   * ========================================================================== */
  function renderTitleScreen() {
    const d = State.data;
    const m = d.meta;
    el.titleMain.textContent = m.title;
    el.titleSub.textContent = m.subtitle || (m.author ? 'by ' + m.author : '');
    el.titleSynopsis.textContent = m.synopsis || '（本作品暂无简介）';
    el.titleTags.innerHTML = m.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('');
    // v2：封面图（data URL）；为 null/缺失时维持 theme 渐变背景
    if (el.coverImage) {
      if (m.cover) {
        el.coverImage.style.backgroundImage = `url("${m.cover}")`;
        el.coverImage.classList.add('on');
        el.titleScreen.classList.add('has-cover');
      } else {
        el.coverImage.style.backgroundImage = '';
        el.coverImage.classList.remove('on');
        el.titleScreen.classList.remove('has-cover');
      }
    }
    const bits = [];
    if (m.author) bits.push(`作者：${m.author}`);
    if (m.version) bits.push(`v${m.version}`);
    if (d.scenes.length) bits.push(`${d.scenes.length} 个场景`);
    if (d.endings.length) bits.push(`${d.endings.length} 个结局`);
    el.titleFoot.textContent = bits.join(' · ');

    const warns = [];
    if (State.fatal) warns.push(State.fatal);
    if (!d.scenes.length) warns.push('剧本中没有任何场景（scenes 为空），无法开始游戏。请检查生成数据。');
    if (!d.characters.length) warns.push('剧本没有角色定义（characters 为空），台词将仅显示文本。');
    if (d.warnings.length) warns.push('数据提示：' + d.warnings.slice(0, 4).join('；') + (d.warnings.length > 4 ? ` 等 ${d.warnings.length} 条` : ''));
    if (warns.length) { el.titleWarn.classList.remove('hidden'); el.titleWarn.innerHTML = warns.map((w) => `<div>⚠ ${esc(w)}</div>`).join(''); }
    else { el.titleWarn.classList.add('hidden'); el.titleWarn.textContent = ''; }

    el.btnStart.disabled = !d.scenes.length;
    el.btnGallery.disabled = !d.endings.length;
    document.title = m.title;
    refreshContinueButton();
  }

  function backToTitle(reason) {
    State.phase = 'title';
    State.pendingChoice = null;
    State.currentLine = null;
    clearAutoTimers();
    stopTypewriter();
    hideChoice();
    closeModal();
    if (reason) State.fatal = str(reason, '');
    showScreen('title');
    renderTitleScreen();
    updateAutoButton();
  }
  function fatal(msg) {
    toast(msg, 2600);
    setTimeout(() => backToTitle(msg), 700);
  }

  function startGame() {
    const d = State.data;
    if (!d.scenes.length) { toast('没有可播放的场景'); return; }
    State.fatal = '';
    State.vars = {};
    State.history = [];
    State.sprites = {};
    State.pendingChoice = null;
    State.visitedOrder = [];
    State.steps = 0;
    State.phase = 'line';
    el.dbox.setAttribute('data-narration', '0');
    el.dtext.textContent = '';
    setSpeaker(null);
    clearSprites();
    showScreen('game');
    if (!enterScene(d.start, 0)) { fatal('起始场景不存在'); return; }
    execLine();
    updateAutoButton();
  }

    const rows = [];

        <div class="slot-info"><div class="slot-name">自动存档 · ${esc(sum.name)}</div><div class="slot-meta">${esc(sum.meta)}</div></div>
        <div class="slot-actions">
          <button class="btn btn-ghost btn-sm" data-slot-load="auto"${sum.empty ? ' disabled' : ''}>读取</button>
          <button class="btn btn-ghost btn-sm" data-slot-del="auto"${sum.empty ? ' disabled' : ''}>删除</button>
        </div>
      </div>`);
    [1, 2, 3].forEach((i) => {
      const s = Persist.readSlot(i);
      const m = slotSummary(s);
      rows.push(`<div class="slot${m.empty ? ' empty' : ''}" data-slot="${i}">
        <div class="slot-info"><div class="slot-name">槽位 ${i} · ${esc(m.name)}</div><div class="slot-meta">${esc(m.meta)}</div></div>
        <div class="slot-actions">
          <button class="btn btn-main btn-sm" data-slot-save="${i}"${State.playMode === 'game' ? '' : ' disabled'}>保存</button>
          <button class="btn btn-ghost btn-sm" data-slot-load="${i}"${m.empty ? ' disabled' : ''}>读取</button>
          <button class="btn btn-ghost btn-sm" data-slot-del="${i}"${m.empty ? ' disabled' : ''}>删除</button>
        </div>
      </div>`);
    });
    openModal('saves', '存档 / 读档', `<div class="slot-list">${rows.join('')}</div>`, [{ label: '关闭', main: true, onClick: closeModal }]);
    const wrap = el.modalRoot.querySelector('.modal');
    wrap.addEventListener('click', (ev) => {
      const t = ev.target;
      if (!(t instanceof HTMLElement)) return;
      const sv = t.getAttribute('data-slot-save');
      const ld = t.getAttribute('data-slot-load');
      const dl = t.getAttribute('data-slot-del');
      if (sv) { saveToSlot(int(sv, 1)); openSaves(); return; }
      if (ld) {
        const save = ld === 'auto' ? Persist.readAuto() : Persist.readSlot(int(ld, 1));
        if (save) loadFrom(save); else toast('该槽位没有存档');
        return;
      }
      if (dl) {
        if (dl === 'auto') LS.del(KEY.autosave); else LS.del(KEY.slot(int(dl, 1)));
        refreshContinueButton(); openSaves(); toast('已删除');
      }
    });
  }

  /* --------------------- v2 立绘 + 好感度面板 --------------------- */
  /** 角色的可用立绘 key 列表（default 优先），没有图时返回空数组 */
  function spriteVariants(ch) {
    const s = obj(ch.sprites);
    return Object.keys(s).filter((k) => typeof s[k] === 'string' && s[k]);
  }
  /** 当前好感度：变量不存在按 0；只接受有限数，其余按 0 */
  function affectionOf(ch) {
    const raw = State.vars[ch.affectionKey];
    const n = (typeof raw === 'number' && Number.isFinite(raw)) ? raw : Number(raw);
    return Number.isFinite(n) ? n : 0;
  }
  /** 好感度百分比（0~100，量程 clamp，数值可为负/超量程） */
  function affectionPct(ch) {
    const max = Math.max(1, num(State.data.meta.affectionMax, 20));
    return Math.max(0, Math.min(100, Math.round(affectionOf(ch) / max * 100)));
  }

  function openAffection() {
    const d = State.data;
    if (!d.characters.length) {
      openModal('affection', '角色 / 好感度', '<div class="empty-tip">剧本里没有角色定义（characters 为空）。</div>', [{ label: '关闭', main: true, onClick: closeModal }]);
      el.modalRoot.querySelector('.panel').setAttribute('data-testid', 'affection-panel');
      return;
    }
    const max = Math.max(1, num(d.meta.affectionMax, 20));
    const rows = d.characters.map((ch) => {
      const variants = spriteVariants(ch);
      const val = affectionOf(ch);
      const pct = affectionPct(ch);
      return `<div class="aff-row" data-testid="affection-row" data-char="${esc(ch.id)}">
        <div class="aff-portrait" data-aff-portrait="${esc(ch.id)}">
          ${portraitHTML(ch, variants, variants[0])}
        </div>
        <div class="aff-body">
          <div class="aff-head">
            <span class="aff-name" style="color:${esc(ch.color)}">${esc(ch.name)}</span>
            ${ch.role ? `<span class="aff-role">${esc(ch.role)}</span>` : ''}
          </div>
          ${ch.profile ? `<div class="aff-profile">${esc(ch.profile)}</div>` : ''}
          <div class="aff-meter-top">
            <span class="aff-meter-label">${esc(ch.affectionLabel)}</span>
            <span class="aff-meter-value" data-testid="affection-value" style="color:${esc(ch.color)}">${esc(fmtVar(val))}<small>/ ${esc(String(max))}</small></span>
          </div>
          <div class="aff-bar"><i style="width:${pct}%"></i></div>
        </div>
      </div>`;
    }).join('');
    const body = `<div class="aff-list">${rows}</div>
      <div class="aff-foot-note">数值实时取自当前变量表：${d.characters.map((c) => `${esc(c.affectionKey)}`).join('、')}；量程 ${max}。共 ${d.characters.length} 名角色。</div>`;
    openModal('affection', '角色 / 好感度', body, [{ label: '关闭', main: true, onClick: closeModal }]);
    const panel = el.modalRoot.querySelector('.panel');
    if (panel) panel.setAttribute('data-testid', 'affection-panel');

    // 多立绘左右切换（事件委托：面板只挂一次监听）
    const wrap = el.modalRoot.querySelector('.modal');
    if (wrap) {
      wrap.addEventListener('click', (ev) => {
        const t = ev.target;
        if (!(t instanceof HTMLElement)) return;
        const prev = t.getAttribute('data-aff-prev');
        const next = t.getAttribute('data-aff-next');
        if (!prev && !next) return;
        const id = prev || next;
        const ch = d.charMap[id];
        if (!ch) return;
        const variants = spriteVariants(ch);
        if (variants.length < 2) return;
        const stateKey = 'affKey' + id;
        const curKey = wrap.dataset[stateKey] || variants[0];
        let idx = variants.indexOf(curKey);
        if (idx < 0) idx = 0;
        idx = (idx + (next ? 1 : variants.length - 1)) % variants.length;
        wrap.dataset[stateKey] = variants[idx];
        const box = wrap.querySelector(`[data-aff-portrait="${id}"]`);
        if (box) box.innerHTML = portraitHTML(ch, variants, variants[idx]);
      });
    }
  }

  /** 立绘槽内容（含多立绘切换条） */
  function portraitHTML(ch, variants, curKey) {
    return spriteMarkup({ id: ch.id, name: ch.name, sprites: ch.sprites, placeholder: ch.placeholder, key: curKey || 'default' })
      + (variants.length > 1 ? `<div class="aff-portrait-nav">
            <button type="button" data-aff-prev="${esc(ch.id)}" aria-label="上一张立绘">‹</button>
            <span class="aff-sprite-name">${esc(curKey || variants[0])}</span>
            <button type="button" data-aff-next="${esc(ch.id)}" aria-label="下一张立绘">›</button>
          </div>` : '');
  }
